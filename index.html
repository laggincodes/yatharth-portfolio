<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230B0D10' stroke='%235DA9FF' stroke-width='6'/><text x='50' y='60' font-family='sans-serif' font-weight='bold' font-size='38' fill='%23F1EFE8' text-anchor='middle'>YS</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Yatharth Saini — AI Builder & CSE Student</title>
    <meta name="description" content="Yatharth Saini's portfolio showcasing AI, voice, frontend and full-stack projects." />
    <meta name="theme-color" content="#0D1014" />

    <!-- Early Theme Detection Script to prevent flash of unstyled theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            // Always default to dark mode on fresh visits or when no saved preference
            root.classList.add('dark');
            root.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Open Graph / Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yatharth Saini — AI Builder & CSE Student" />
    <meta property="og:description" content="Yatharth Saini's portfolio showcasing AI, voice, frontend and full-stack projects." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yatharth Saini — AI Builder & CSE Student" />
    <meta name="twitter:description" content="Yatharth Saini's portfolio showcasing AI, voice, frontend and full-stack projects." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-text-primary antialiased selection:bg-surface-hover selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
